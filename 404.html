<!doctype html>
<html lang="en">

    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 15vh auto;

        line-height: 1.7;
        color: #0f172a;
        background: #f8fafc;
      }
      a {
        color: #0d7d70;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8edf6;
          background: #020617;
        }
        a {
          color: #2dd4bf;
        }
      }
    </style>
  </head>
  <body>
    <p>Redirecting to the Masareef privacy policy.</p>

      If nothing happens, open

    <p lang="ar" dir="rtl">
      جارٍ التحويل إلى سياسة خصوصية مصاريف. إن لم يحدث شيء، افتح الرابط أعلاه.
