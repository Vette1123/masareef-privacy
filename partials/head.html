<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07121c" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // A theme picked with the switch applies before the first paint, so the page never flashes.
      try {
        var t = localStorage.getItem('go-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#07121c' : '#f3f8f6'; });
        }
      } catch (e) {}
    </script>
