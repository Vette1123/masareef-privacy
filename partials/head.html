<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07121c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="twitter:creator" content="@Sadge1996" />
    <script>
      // A theme picked with the switch applies before the first paint, so the page never flashes.
      try {
        var t = localStorage.getItem('go-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#07121c' : '#f3f8f6'; });
        }
      } catch (e) {}
      // Visits on mohamedgado.com, which proxies every page here, count in its Vercel Web
      // Analytics: cookieless, same origin, and stated in the policy (section 12). The github.io
      // copies load nothing. A link's ?s=<source> (masareef.mohamedgado.com/?s=ig) reaches the
      // dashboard as utm_source, so sources can be compared.
      if (/(^|\.)mohamedgado\.com$/.test(location.hostname)) {
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.va('beforeSend', function (e) {
          // masareef.mohamedgado.com serves the install page in place (no 301 to www), so its
          // pageview would count as that host's `/`, mixed with the portfolio home. It counts
          // under the page's canonical www URL instead, with the query kept.
          var c = location.hostname !== 'www.mohamedgado.com' && document.querySelector('link[rel="canonical"]');
          if (c) { var q = e.url.search(/[?#]/); e = Object.assign({}, e, { url: c.href + (q < 0 ? "" : e.url.slice(q)) }); }
          var m = /[?&]s=([a-z0-9_-]{1,40})(&|#|$)/i.exec(e.url);
          if (!m || /[?&]utm_source=/.test(e.url)) return e;
          return Object.assign({}, e, { url: e.url.replace(/#.*$/, '') + '&utm_source=' + m[1].toLowerCase() });
        });
        var va = document.createElement('script');
        va.defer = true;
        va.src = '/_vercel/insights/script.js';
        document.head.appendChild(va);
      }
    </script>
