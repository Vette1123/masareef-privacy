<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    {{HEAD}}
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07121c" />
    <meta name="color-scheme" content="light dark" />
    {{ROUTE}}
    <script type="application/ld+json">{{JSONLD}}</script>
    <link rel="icon" href="{{IMG}}icon-96.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="https://vette1123.github.io/masareef-privacy/icon.png" />
    <!--
      The one link printed inside every share card's QR code, and the page search sends
      to for "expense tracker app". Served at /masareef-privacy/go (GitHub Pages drops the
      .html) and proxied at mohamedgado.com/projects/masareef/go. The path must never
      change: cards already sent cannot be updated.

      Fast by construction: the largest thing in the first screen is the headline (text,
      painted on the first frame), every picture below it is lazy, AVIF with a WebP
      fallback, and sized so nothing shifts. No web fonts, no scripts from anyone else.
      Both store badges are the official artwork: Apple and Google forbid redrawing them.
    -->
    <style>
      :root {
        --bg: #f3f8f6; --bg-2: #e4f1ec; --ink: #0f1d27; --soft: #43555f; --faint: #5f727b;
        --teal: #0e7c70; --mint: #5eead4; --line: rgba(15, 29, 39, 0.1); --panel: #ffffff;
        --band: #0f1d27; --band-ink: #eef7f5; --band-soft: #b4cbc8;
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
        --display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --arabic: "SF Arabic", "Geeza Pro", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07121c; --bg-2: #0c1d2b; --ink: #eaf4f2; --soft: #aec3c6; --faint: #9ab0b4;
          --teal: #2dd4bf; --line: rgba(234, 244, 242, 0.1); --panel: #0f2130;
          --band: #0d2233; --band-ink: #eef7f5; --band-soft: #b4cbc8;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: clip; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 16px/1.6 var(--ui); -webkit-font-smoothing: antialiased;
      }
      html[lang="ar"] body { font-family: var(--arabic); }
      img { max-width: 100%; height: auto; display: block; }
      a { color: inherit; }
      h1, h2, h3 { margin: 0; text-wrap: balance; }
      p { margin: 0; text-wrap: pretty; }
      :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 10px; }
      .wrap {
        width: 100%; max-width: 1180px; margin-inline: auto;
        padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right));
      }

      /* ---- top ---- */
      .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: max(18px, env(safe-area-inset-top)) 18px; }
      .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; text-decoration: none; }
      .brand img { width: 40px; height: 40px; border-radius: 10px; }
      .brand small { font-weight: 500; color: var(--faint); font-size: 15px; }
      .lang { font: 600 14px var(--ui); padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; transition: border-color 200ms var(--ease); }
      .lang:hover { border-color: var(--teal); }

      /* ---- hero: the headline is the first paint ---- */
      .hero { position: relative; isolation: isolate; padding-block: 28px 40px; display: grid; gap: 28px; }
      .hero::before {
        content: ""; position: absolute; z-index: -1; inset: -120px 0 auto; height: 520px; pointer-events: none;
        background:
          radial-gradient(40% 60% at 15% 30%, rgba(94, 234, 212, 0.28), transparent 70%),
          radial-gradient(35% 55% at 80% 20%, rgba(165, 180, 252, 0.22), transparent 70%);
      }
      .kicker { display: block; font: 700 15px/1.4 var(--ui); color: var(--teal); letter-spacing: 0.01em; margin-bottom: 14px; }
      html[lang="ar"] .kicker { font-family: var(--arabic); }
      .big { display: block; font-family: var(--display); font-size: clamp(40px, 8.4vw, 104px); line-height: 0.99; letter-spacing: -0.045em; font-weight: 850; }
      .big span { color: var(--faint); }
      html[lang="ar"] .big { font-family: var(--arabic); line-height: 1.22; letter-spacing: 0; font-weight: 800; font-size: clamp(38px, 7.6vw, 92px); }
      .hero .row { display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: end; justify-content: space-between; }
      .lede { font-size: clamp(17px, 2vw, 20px); color: var(--soft); max-width: 40ch; }

      /* ---- official badges, equal visual height ---- */
      .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      .badges a { display: block; border-radius: 10px; transition: transform 220ms var(--ease); -webkit-tap-highlight-color: transparent; }
      .badges a:hover { transform: translateY(-2px); }
      .badges a:active { transform: scale(0.97); }
      .badges .apple img { width: 156px; height: 52px; }
      /* Google's PNG carries its own clear space: at 76px tall its artwork matches the
         Apple badge's 52, which Google's rules ask for (same size or larger). */
      .badges .play { margin: -12px -10px; }
      .badges .play img { width: 197px; height: 76px; }

      /* ---- facts ---- */
      .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line); }
      .facts div { padding: 22px 18px; border-inline-start: 1px solid var(--line); min-width: 0; }
      .facts div:first-child { border-inline-start: 0; padding-inline-start: 0; }
      .facts b { display: block; font-size: 22px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
      .facts span { font-size: 14px; color: var(--soft); }

      /* ---- story: one sticky phone, the screen follows the reader ---- */
      .story { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; }
      .steps { display: grid; }
      .step { min-height: 76vh; display: grid; align-content: center; gap: 14px; padding-block: 40px; border-top: 1px solid var(--line); transition: opacity 400ms var(--ease); }
      .step:first-child { border-top: 0; }
      .js .step:not(.on) { opacity: 0.42; }
      .step .k { font: 700 14px var(--ui); color: var(--teal); }
      html[lang="ar"] .step .k { font-family: var(--arabic); font-size: 15px; }
      .step h2 { font-family: var(--display); font-size: clamp(30px, 4vw, 50px); line-height: 1.08; letter-spacing: -0.025em; }
      html[lang="ar"] .step h2 { font-family: var(--arabic); line-height: 1.35; letter-spacing: 0; }
      .step p { font-size: 18px; color: var(--soft); max-width: 42ch; }
      .step .mini { display: none; }
      .stage { position: sticky; top: 24px; height: min(calc(100vh - 48px), 820px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .halo { position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 200deg, #5eead4, #a5b4fc, #fde68a, #5eead4); filter: blur(60px); opacity: 0.42; pointer-events: none; }
      .stack { position: relative; width: min(340px, 82%, calc((100vh - 140px) * 720 / 1471)); aspect-ratio: 720 / 1471; }
      .stack picture, .stack img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .stack img { filter: drop-shadow(0 40px 56px rgba(15, 29, 39, 0.28)); transition: opacity 520ms var(--ease), transform 640ms var(--ease); }
      .stack picture:not(.on) img { opacity: 0; transform: translateY(18px) scale(0.98); }
      .dots { position: relative; display: flex; gap: 8px; }
      .dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); transition: width 360ms var(--ease), background-color 360ms var(--ease); }
      .dots i.on { width: 22px; background: var(--teal); }

      /* ---- privacy band ---- */
      .band { margin-block: 48px; padding: 56px; border-radius: 32px; background: var(--band); color: var(--band-ink); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; position: relative; overflow: hidden; isolation: isolate; }
      .band::before { content: ""; position: absolute; z-index: -1; inset: auto -10% -60% 40%; height: 120%; background: radial-gradient(closest-side, rgba(94, 234, 212, 0.22), transparent); }
      .band h2 { font-family: var(--display); font-size: clamp(28px, 3.4vw, 42px); line-height: 1.12; letter-spacing: -0.02em; }
      html[lang="ar"] .band h2 { font-family: var(--arabic); line-height: 1.4; letter-spacing: 0; }
      .band p { margin-top: 14px; color: var(--band-soft); max-width: 48ch; }
      .band ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
      .band li { display: flex; gap: 12px; align-items: baseline; }
      .band li::before { content: "✓"; color: var(--mint); font-weight: 800; }

      /* ---- faq ---- */
      .faq { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 40px; padding-block: 32px 40px; }
      .faq h2 { font-family: var(--display); font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em; }
      html[lang="ar"] .faq h2 { font-family: var(--arabic); letter-spacing: 0; }
      details { border-top: 1px solid var(--line); }
      details:last-child { border-bottom: 1px solid var(--line); }
      summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding-block: 18px; font-weight: 650; font-size: 17px; min-height: 44px; }
      summary::-webkit-details-marker { display: none; }
      summary::after { content: "+"; flex: none; font-weight: 400; font-size: 24px; line-height: 1; color: var(--teal); transition: transform 260ms var(--ease); }
      details[open] summary::after { transform: rotate(45deg); }
      details p { padding-bottom: 18px; color: var(--soft); max-width: 62ch; }

      /* ---- closing ---- */
      .cta { text-align: center; padding-block: 56px 64px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); display: grid; justify-items: center; gap: 22px; }
      .cta img.ic { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 24px 40px -14px rgba(15, 29, 39, 0.45); }
      .cta h2 { font-family: var(--display); font-size: clamp(32px, 4.4vw, 54px); letter-spacing: -0.025em; line-height: 1.1; }
      html[lang="ar"] .cta h2 { font-family: var(--arabic); letter-spacing: 0; line-height: 1.35; }
      .cta .badges { justify-content: center; }
      .foot { padding-block: 28px max(40px, env(safe-area-inset-bottom)); font-size: 14px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; border-top: 1px solid var(--line); }
      .foot nav { display: flex; gap: 6px 20px; flex-wrap: wrap; }
      .foot a { color: var(--soft); text-underline-offset: 3px; padding-block: 6px; }
      .foot a:hover { color: var(--teal); }

      /* ---- motion: transform only, so the first frame is already the page ---- */
      @media (prefers-reduced-motion: no-preference) {
        .rise { animation: rise 760ms var(--ease) both; }
        .rise.d1 { animation-delay: 80ms; }
        @keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
        .halo { animation: spin 26s linear infinite; }
        @keyframes spin { to { rotate: 360deg; } }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }

      /* ---- phone: every step carries its own screen ---- */
      @media (max-width: 860px) {
        .story, .band, .faq { grid-template-columns: minmax(0, 1fr); }
        .stage { display: none; }
        .js .step:not(.on) { opacity: 1; }
        .step { min-height: 0; padding-block: 44px; justify-items: center; text-align: center; }
        .step p { margin-inline: auto; }
        .step .mini { display: grid; place-items: center; position: relative; isolation: isolate; width: min(270px, 78%); margin-top: 18px; }
        .step .mini::before { content: ""; position: absolute; z-index: -1; width: 120%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(94, 234, 212, 0.4), transparent); }
        .step .mini img { filter: drop-shadow(0 28px 40px rgba(15, 29, 39, 0.26)); }
        .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .facts div:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; }
        .facts div:nth-child(n + 3) { border-top: 1px solid var(--line); }
        .band { padding: 36px 24px; border-radius: 26px; margin-block: 24px; }
        .faq { gap: 16px; }
        .hero .badges { width: 100%; }
      }
      @media (max-width: 380px) {
        .brand small { display: none; }
        .badges .apple img { width: 138px; height: 46px; }
        .badges .play { margin: -10px -9px; }
        .badges .play img { width: 174px; height: 67px; }
        .facts div { padding: 18px 12px; }
        .facts div:first-child, .facts div:nth-child(3) { padding-inline-start: 0; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="{{SELF}}"><img src="{{IMG}}icon-96.webp" width="40" height="40" alt="" />{{BRAND}} <small lang="{{OTHER}}">{{ALT}}</small></a>
        {{SWITCH}}
      </header>

      <section class="hero">
        <h1 class="rise"><span class="kicker">{{KICKER}}</span><span class="big">{{H1A}} <span>{{H1B}}</span></span></h1>
        <div class="row rise d1">
          <p class="lede">{{LEDE}}</p>
          <nav class="badges" aria-label="{{NAV_LABEL}}">{{BADGES}}</nav>
        </div>
      </section>

      <div class="facts">{{FACTS}}</div>

      <section class="story">
        <div class="steps">{{STEPS}}</div>
        <div class="stage" aria-hidden="true"><div class="halo"></div><div class="stack">{{STACK}}</div><div class="dots">{{DOTS}}</div></div>
      </section>

      <section class="band">
        <div><h2>{{PRIV_H}}</h2><p>{{PRIV_P}}</p></div>
        <ul>{{PRIV}}</ul>
      </section>

      <section class="faq">
        <h2>{{FAQ_H}}</h2>
        <div>{{FAQ}}</div>
      </section>
    </div>

    <section class="cta">
      <img class="ic" src="{{IMG}}icon-192.webp" width="88" height="88" alt="" loading="lazy" decoding="async" />
      <h2>{{CTA_H}}</h2>
      <nav class="badges" aria-label="{{NAV_LABEL}}">{{BADGES}}</nav>
    </section>

    <div class="wrap"><footer class="foot"><span>{{FOOT}}</span><nav>{{LINKS}}</nav></footer></div>

    <script>
      (function () {
        document.documentElement.classList.add('js');

        // The reader's own store goes first, in both badge rows. iPadOS reports itself
        // as a Mac, so Macintosh counts as Apple. Nothing redirects: an in-app browser
        // that blocks the bounce would show the reader nothing at all.
        var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '');
        if (!apple) document.querySelectorAll('.badges').forEach(function (n) { n.prepend(n.querySelector('.play')); });

        // Attribution survives the hop. A text share from the app arrives as `?s=<anchor>`:
        // Play reads it back out of `referrer` (utm_source=<anchor>, utm_medium=share),
        // App Store Connect out of `ct`. Without it (a scanned card) the hrefs stand: card/qr.
        var m = /[?&]s=([a-z0-9_-]{1,40})/i.exec(location.search);
        if (m) {
          var tag = m[1].toLowerCase();
          document.querySelectorAll('.badges .play').forEach(function (a) {
            a.href = a.href.replace(/&referrer=[^&]*/, '&referrer=' + encodeURIComponent('utm_source=' + tag + '&utm_medium=share'));
          });
          document.querySelectorAll('.badges .apple').forEach(function (a) {
            a.href = a.href.replace(/([?&])ct=[^&]*/, '$1ct=' + encodeURIComponent(tag + '-share'));
          });
        }

        // The sticky phone shows the screen of the step being read.
        var steps = document.querySelectorAll('.step');
        var shots = document.querySelectorAll('.stack picture');
        var dots = document.querySelectorAll('.dots i');
        if (!('IntersectionObserver' in window)) { steps.forEach(function (s) { s.classList.add('on'); }); return; }
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            if (!e.isIntersecting) return;
            var i = +e.target.getAttribute('data-i');
            steps.forEach(function (s, j) { s.classList.toggle('on', i === j); });
            shots.forEach(function (s, j) { s.classList.toggle('on', i === j); });
            dots.forEach(function (s, j) { s.classList.toggle('on', i === j); });
          });
        }, { rootMargin: '-45% 0px -45% 0px' });
        steps.forEach(function (s) { io.observe(s); });
      })();
    </script>
  </body>
</html>
